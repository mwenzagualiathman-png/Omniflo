name: OmniFlo Build Test

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - "content/**"
      - "package.json"
      - "package-lock.json"
      - "netlify.toml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout OmniFlo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build OmniFlo content
        run: npm run build
      - name: Save OmniFlo build
        uses: actions/upload-artifact@v4
        with:
          name: omniflo-build-test
          path: |
            articles
            products
            solutions
            resources
            assets
            index.html
            css
            js
            admin
            package.json
            netlify.toml
          retention-days: 1
